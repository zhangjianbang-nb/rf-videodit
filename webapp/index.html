<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF-VideoDiT 视频生成演示</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141821;
    --panel-2: #1b2130;
    --line: #263042;
    --text: #e6ebf5;
    --muted: #8b97ad;
    --accent: #5b8cff;
    --accent-2: #7ce0c3;
    --warn: #ffb454;
    --err: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text); font: 14px/1.55 -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 64px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 9px 11px; background: #0e1320; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.15); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--text); font-size: 13px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  button {
    margin-top: 18px; width: 100%; padding: 12px 14px; border: 0; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #3f6ae0 100%); color: #fff;
    font-size: 14.5px; font-weight: 600; cursor: pointer; transition: transform .06s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .bar { height: 8px; background: #0e1320; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 14px; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s ease; }
  .status { margin-top: 9px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--accent-2); }
  .stage { display: flex; align-items: center; justify-content: center; min-height: 320px; }
  video { width: 100%; max-height: 62vh; border-radius: 10px; background: #05070c; display: block; }
  .placeholder { color: var(--muted); text-align: center; font-size: 13.5px; padding: 40px 20px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
  .kv { background: #0e1320; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .kv b { display: block; font-size: 16px; color: var(--accent-2); font-weight: 650; }
  .kv span { font-size: 11.5px; color: var(--muted); }
  .history { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
  .hist { background: #0e1320; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; cursor: pointer; }
  .hist:hover { border-color: var(--accent); }
  .hist video { border-radius: 0; max-height: 130px; pointer-events: none; }
  .hist .cap { padding: 7px 9px; font-size: 11.5px; color: var(--muted); }
  .note { margin-top: 14px; font-size: 12.5px; color: var(--warn); background: rgba(255,180,84,.08);
          border: 1px solid rgba(255,180,84,.25); border-radius: 9px; padding: 10px 12px; }
  .tag { display: inline-block; padding: 2px 7px; border: 1px solid var(--line); border-radius: 99px;
         font-size: 11px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RF-VideoDiT <span>视频生成演示</span></h1>
    <span class="sub">流匹配（rectified flow）+ 因子化时空注意力 DiT · UCF-101 动作视频 · 64×64×16 帧</span>
  </header>
  <div class="sub" id="modelLine">加载模型信息…</div>

  <div class="layout">
    <section class="card">
      <h2>生成参数</h2>

      <label for="cls">动作类别（可搜索）</label>
      <input id="cls" list="clsList" type="text" placeholder="例如 BasketballDunk / Surfing" autocomplete="off">
      <datalist id="clsList"></datalist>

      <div class="check">
        <input type="checkbox" id="uncond">
        <label for="uncond" style="margin:0;color:var(--text)">无条件生成（不指定类别）</label>
      </div>

      <div class="row">
        <div><label for="n">样本数</label><input id="n" type="number" min="1" max="16" value="4"></div>
        <div><label for="steps">采样步数</label><input id="steps" type="number" min="4" max="200" value="25"></div>
      </div>

      <div class="row">
        <div><label for="cfg">CFG 强度</label><input id="cfg" type="number" min="1" max="10" step="0.5" value="3"></div>
        <div><label for="seed">随机种子</label><input id="seed" type="number" min="0" value="0"></div>
      </div>

      <div class="row">
        <div><label for="solver">求解器</label>
          <select id="solver"><option value="heun" selected>heun（二阶，2 NFE/步）</option><option value="euler">euler（1 NFE/步）</option></select>
        </div>
        <div><label for="frames">帧数</label><input id="frames" type="number" min="4" max="64" value="16"></div>
      </div>

      <button id="go">生成视频</button>
      <div class="bar"><i id="barFill"></i></div>
      <div class="status" id="status">就绪</div>
      <div class="note" id="note"></div>
    </section>

    <section class="card">
      <h2>结果</h2>
      <div class="stage" id="stage">
        <div class="placeholder">还没有生成结果。<br>左侧选择动作类别后点“生成视频”。</div>
      </div>
      <div class="meta" id="metaBox"></div>
      <h2 style="margin-top:22px">历史记录</h2>
      <div class="history" id="history"></div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let META = null, classes = [], classIndex = new Map(), polling = null;

async function loadMeta() {
  META = await (await fetch('/api/meta')).json();
  classes = META.classes;
  classes.forEach((c, i) => classIndex.set(c, i));
  $('clsList').innerHTML = classes.map(c => `<option value="${c}">`).join('');
  $('modelLine').innerHTML =
    `检查点 <code>${META.checkpoint}</code> · 训练步数 <b>${META.trained_steps.toLocaleString()}</b> · ` +
    `参数量 ${META.params_millions}M · 类别数 ${META.num_classes}`;
  if (META.notes) { $('note').textContent = META.notes; $('note').style.display = ''; }
  else { $('note').style.display = 'none'; }
  const d = META.defaults;
  $('steps').value = d.steps; $('cfg').value = d.cfg_scale; $('n').value = d.num_samples; $('frames').value = d.frames;
  $('cls').value = classes[0] || '';
}

function setStatus(text, cls = '') { const s = $('status'); s.textContent = text; s.className = 'status ' + cls; }

function addHistory(jobId, videoUrl, caption) {
  const div = document.createElement('div');
  div.className = 'hist';
  div.innerHTML = `<video src="${videoUrl}" muted loop autoplay playsinline></video><div class="cap">${caption}</div>`;
  div.onclick = () => showVideo(videoUrl, caption);
  $('history').prepend(div);
  while ($('history').children.length > 8) $('history').lastChild.remove();
}

function showVideo(url, caption) {
  $('stage').innerHTML = `<video src="${url}?t=${Date.now()}" controls autoplay loop playsinline></video>`;
  $('metaBox').innerHTML =
    `<div class="kv"><b>${caption}</b><span>生成配置</span></div>` +
    `<div class="kv"><b>${$('steps').value}</b><span>采样步数 · ${$('solver').value}</span></div>` +
    `<div class="kv"><b>${$('cfg').value}</b><span>CFG 强度</span></div>` +
    `<div class="kv"><b>${$('seed').value}</b><span>随机种子</span></div>`;
}

async function generate() {
  const uncond = $('uncond').checked;
  const name = $('cls').value.trim();
  let classId = null;
  if (!uncond) {
    if (!classIndex.has(name)) { setStatus('类别名不在列表中，请从下拉建议里选择', 'err'); return; }
    classId = classIndex.get(name);
  }
  const body = {
    num_samples: +$('n').value, steps: +$('steps').value, cfg_scale: +$('cfg').value,
    seed: +$('seed').value, solver: $('solver').value, frames: +$('frames').value,
    class_id: classId
  };
  $('go').disabled = true; $('barFill').style.width = '0%';
  setStatus('提交任务…');
  const t0 = performance.now();
  const res = await (await fetch('/api/generate', { method: 'POST', body: JSON.stringify(body) })).json();
  if (res.error) { setStatus(res.error, 'err'); $('go').disabled = false; return; }
  const jobId = res.job_id;

  polling = setInterval(async () => {
    const job = await (await fetch('/api/job?id=' + jobId)).json();
    const pct = Math.round((job.progress || 0) * 100);
    $('barFill').style.width = pct + '%';
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    if (job.status === 'running') setStatus(`采样中 ${pct}%（${secs}s）…`);
    else if (job.status === 'done') {
      clearInterval(polling);
      setStatus(`完成，用时 ${job.elapsed.toFixed(1)}s`, 'ok');
      $('go').disabled = false;
      const caption = (uncond ? '无条件' : name) + ` · ${body.num_samples} 样本`;
      showVideo(job.video, caption);
      addHistory(jobId, job.video, caption);
    } else if (job.status === 'error') {
      clearInterval(polling);
      setStatus('生成失败：' + job.error, 'err');
      $('go').disabled = false;
    } else setStatus('排队中…');
  }, 600);
}

$('go').onclick = generate;
$('uncond').onchange = () => { $('cls').disabled = $('uncond').checked; };
loadMeta().catch(e => setStatus('无法连接后端：' + e, 'err'));
</script>
</body>
</html>
